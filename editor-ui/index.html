<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MkNexus Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #111113;
      --bg-tertiary: #1a1a1d;
      --border: #2a2a2e;
      --border-hover: #3a3a3e;
      --text-primary: #e4e4e7;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #22c55e;
      --accent-dim: rgba(34, 197, 94, 0.15);
      --danger: #ef4444;
      --danger-dim: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --info: #3b82f6;

      --font-mono: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
      --font-serif: 'Source Serif 4', Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.5;
    }

    #app {
      display: flex;
      height: 100%;
    }

    /* === Sidebar === */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .sidebar-actions {
      display: flex;
      gap: 4px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .btn-icon:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .btn-icon svg {
      width: 16px;
      height: 16px;
    }

    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .tree-item {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      user-select: none;
      margin-bottom: 2px;
      transition: all 0.1s ease;
    }

    .tree-item:hover {
      background: var(--bg-tertiary);
    }

    .tree-item.active {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .tree-item.active svg {
      color: var(--accent);
    }

    .tree-item svg {
      width: 14px;
      height: 14px;
      color: var(--text-muted);
      margin-right: 8px;
      flex-shrink: 0;
    }

    .tree-name {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tree-actions {
      display: none;
      gap: 4px;
    }

    .tree-item:hover .tree-actions {
      display: flex;
    }

    .tree-actions button {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tree-actions button:hover {
      color: var(--text-primary);
      background: var(--bg-secondary);
    }

    .tree-actions .btn-delete:hover {
      color: var(--danger);
    }

    .tree-children {
      margin-left: 16px;
    }

    .tree-folder {
      font-weight: 500;
    }

    /* === Editor Area === */
    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .editor-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-secondary);
    }

    .file-status {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .file-status.modified {
      color: var(--warning);
    }

    .editor-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn:hover {
      border-color: var(--border-hover);
      background: var(--bg-secondary);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg-primary);
    }

    .btn-primary:hover {
      background: #16a34a;
      border-color: #16a34a;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .editor-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .editor-pane,
    .preview-pane {
      flex: 1;
      overflow: auto;
      min-width: 0;
    }

    .editor-pane {
      border-right: 1px solid var(--border);
    }

    #editor {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      resize: none;
      padding: 24px;
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-primary);
    }

    #editor:focus {
      outline: none;
    }

    #editor::placeholder {
      color: var(--text-muted);
    }

    /* === Preview === */
    .preview-pane {
      background: var(--bg-secondary);
    }

    .preview-content {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 32px 64px;
    }

    .preview-content * {
      max-width: 100%;
    }

    .preview-content h1,
    .preview-content h2,
    .preview-content h3,
    .preview-content h4,
    .preview-content h5,
    .preview-content h6 {
      font-family: var(--font-serif);
      font-weight: 600;
      line-height: 1.3;
      margin-top: 32px;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .preview-content h1 { font-size: 28px; }
    .preview-content h2 { font-size: 22px; }
    .preview-content h3 { font-size: 18px; }
    .preview-content h4 { font-size: 16px; }

    .preview-content p {
      margin-bottom: 16px;
      line-height: 1.7;
    }

    .preview-content code {
      font-family: var(--font-mono);
      font-size: 13px;
      background: var(--bg-tertiary);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent);
    }

    .preview-content pre {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 16px;
    }

    .preview-content pre code {
      background: none;
      padding: 0;
      color: var(--text-primary);
    }

    .preview-content ul,
    .preview-content ol {
      margin-bottom: 16px;
      padding-left: 24px;
    }

    .preview-content li {
      margin-bottom: 6px;
    }

    .preview-content a {
      color: var(--accent);
      text-decoration: none;
    }

    .preview-content a:hover {
      text-decoration: underline;
    }

    .preview-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 16px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .preview-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    .preview-content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
    }

    .preview-content th,
    .preview-content td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }

    .preview-content th {
      background: var(--bg-tertiary);
      font-weight: 600;
    }

    .preview-content img {
      max-width: 100%;
      border-radius: var(--radius-md);
    }

    /* === Dialogs === */
    dialog {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 24px;
      box-shadow: var(--shadow);
      max-width: 400px;
      width: 90vw;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.7);
    }

    dialog h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    dialog input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 14px;
      margin-bottom: 16px;
    }

    dialog input:focus {
      outline: none;
      border-color: var(--accent);
    }

    dialog .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* === Toast === */
    .toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: 13px;
      animation: slideIn 0.2s ease;
    }

    .toast.success {
      border-color: var(--accent);
      color: var(--accent);
    }

    .toast.error {
      border-color: var(--danger);
      color: var(--danger);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* === Scrollbar === */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-hover);
    }

    /* === Empty State === */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      padding: 32px;
      text-align: center;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* === Loading === */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text-muted);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>MkNexus</h1>
        <div class="sidebar-actions">
          <button class="btn-icon" id="newFileBtn" title="新建文件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <button class="btn-icon" id="newFolderBtn" title="新建目录">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
          <button class="btn-icon" id="refreshBtn" title="刷新">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6M1 20v-6h6"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="file-tree" id="fileTree">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </aside>

    <!-- Editor Area -->
    <main class="editor-area">
      <div class="editor-header">
        <span class="file-status" id="fileStatus">未选择文件</span>
        <div class="editor-actions">
          <button class="btn" id="previewToggle">预览</button>
          <button class="btn btn-primary" id="saveBtn" disabled>保存</button>
        </div>
      </div>

      <div class="editor-container">
        <div class="editor-pane">
          <textarea id="editor" placeholder="选择一个文件开始编辑..."></textarea>
        </div>
        <div class="preview-pane" id="previewPane" style="display: none;">
          <div class="preview-content" id="preview"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- New File Dialog -->
  <dialog id="newFileDialog">
    <h3>新建文件</h3>
    <form method="dialog">
      <input type="text" id="newFileName" placeholder="文件名.md" required>
      <div class="dialog-actions">
        <button type="button" class="btn" id="cancelNewFile">取消</button>
        <button type="submit" class="btn btn-primary">创建</button>
      </div>
    </form>
  </dialog>

  <!-- New Folder Dialog -->
  <dialog id="newFolderDialog">
    <h3>新建目录</h3>
    <form method="dialog">
      <input type="text" id="newFolderName" placeholder="目录名" required>
      <div class="dialog-actions">
        <button type="button" class="btn" id="cancelNewFolder">取消</button>
        <button type="submit" class="btn btn-primary">创建</button>
      </div>
    </form>
  </dialog>

  <!-- Rename Dialog -->
  <dialog id="renameDialog">
    <h3>重命名</h3>
    <form method="dialog">
      <input type="text" id="renameInput" placeholder="新名称" required>
      <div class="dialog-actions">
        <button type="button" class="btn" id="cancelRename">取消</button>
        <button type="submit" class="btn btn-primary">确定</button>
      </div>
    </form>
  </dialog>

  <!-- Delete Confirm Dialog -->
  <dialog id="deleteDialog">
    <h3>确认删除</h3>
    <p id="deleteMessage">确定要删除此文件吗？</p>
    <div class="dialog-actions">
      <button type="button" class="btn" id="cancelDelete">取消</button>
      <button type="button" class="btn btn-primary" id="confirmDelete">删除</button>
    </div>
  </dialog>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js?v=30"></script>
</body>
</html>
